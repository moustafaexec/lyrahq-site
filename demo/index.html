:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000812}
body{color:#F4F9FF;font-family:'Libre Franklin',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px 96px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.mark{margin:0;line-height:0;color:#FFFFFF}
.mark svg{display:block;width:min(210px,60vw);height:auto;aspect-ratio:328/105}
.for{margin:26px 0 30px;font-size:14px;line-height:1.5;color:#A9B0BA;text-align:center}
/* With a logo: the logo and the two words are one line, never broken, and the words sit on the baseline of the letters of the logo.
   The height of the logo and how far it hangs under that baseline are set on the image, in whole pixels, from tools/gate/logos/logos.json. */
.for.lockup{font-size:15px;line-height:1;white-space:nowrap}
.for.lockup img{display:inline-block;width:auto;margin-right:14px}
.bar{display:flex;align-items:center;width:100%;max-width:360px;height:52px;padding:0 6px 0 22px;border-radius:999px;border:1px solid rgba(244,249,255,.14);background:rgba(32,40,49,.78);transition:border-color .2s ease}
.bar:focus-within{border-color:rgba(244,249,255,.55)}
.bar input{flex:1;min-width:0;height:100%;padding:0;border:0;background:transparent;color:#F4F9FF;font:inherit;font-size:16px;outline:none}
.bar input::placeholder{color:#7C848F}
.go{flex:none;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:#F4F9FF;color:#000812;cursor:pointer;transition:background-color .2s ease,opacity .2s ease}
.go:hover{background:#FFFFFF}
.go[disabled]{opacity:.6;cursor:default}
.go svg{display:block}
.go:focus-visible{outline:2px solid #F4F9FF;outline-offset:3px}
.msg{min-height:20px;margin:14px 0 0;font-size:13px;line-height:1.45;color:#E0E5EB;text-align:center}
.foot{position:fixed;left:0;right:0;bottom:10px;bottom:max(10px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.02em;color:rgba(244,249,255,.45);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<script>
/* The demo is in this page, encrypted (AES-GCM, key derived from the password with PBKDF2). The password is in no file. */
(function(){
  var cfg=JSON.parse(document.getElementById("payload").textContent),T={"wait":"Opening…","bad":"That password doesn't match.","old":"This browser can't open the demo. Try a recent Safari or Chrome."};
  var form=document.getElementById("gate"),field=document.getElementById("code"),msg=document.getElementById("msg"),go=form.querySelector(".go");
  var KEEP="lyra-demo-key";
  function bytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  function text(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
  /* The demo replaces this page. Not before the page has finished loading: written earlier, it would be added under the form. */
  function open(html){
    if(document.readyState!=="complete"){window.addEventListener("load",function(){open(html);});return;}
    document.open();document.write(html);document.close();
  }
  function read(key){
    return crypto.subtle.importKey("raw",key,"AES-GCM",false,["decrypt"])
      .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(cfg.i)},k,bytes(cfg.c));})
      .then(function(buf){return new TextDecoder("utf-8").decode(buf);});
  }
  function derive(code){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"])
      .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",salt:bytes(cfg.s),iterations:cfg.n,hash:"SHA-256"},k,256);})
      .then(function(bits){return new Uint8Array(bits);});
  }
  if(!(window.crypto&&crypto.subtle)){msg.textContent=T.old;go.disabled=true;return;}
  /* A phone that scanned the QR code of the demo: the address carries the key of the demo and the live session.
     The key opens the demo without the password, and the address is cleaned before the demo shows. */
  var J=/^#join=([A-Za-z0-9_-]{8,40})\.([A-Za-z0-9_-]{16,64})\.(\d)\.([A-Za-z0-9_-]{40,48})(?:\.(fr|en))?$/.exec(location.hash);
  if(J){
    var jk=bytes(J[4].replace(/-/g,"+").replace(/_/g,"/")+"=");
    try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
    read(jk).then(function(html){try{sessionStorage.setItem(KEEP,text(jk));sessionStorage.setItem("lyra-join",J[1]+"."+J[2]+"."+J[3]);if(J[5])sessionStorage.setItem("lyra-lang",J[5]);}catch(e){}open(html);},function(){msg.textContent=T.bad;});
  }else
  /* Same tab, already opened: no second ask on reload. */
  try{var kept=sessionStorage.getItem(KEEP);if(kept)read(bytes(kept)).then(open,function(){try{sessionStorage.removeItem(KEEP);}catch(e){}});}catch(e){}
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var code=field.value.trim().toLowerCase();
    if(!code){field.focus();return;}
    go.disabled=true;msg.textContent=T.wait;
    derive(code).then(function(key){
      return read(key).then(function(html){try{sessionStorage.setItem(KEEP,text(key));}catch(e){}open(html);});
    }).catch(function(){go.disabled=false;msg.textContent=T.bad;field.select();});
  });
  field.focus();
})();
</script>
